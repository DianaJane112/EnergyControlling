# ── 初始管理员/运营人员密码（仅首次启动时生效，通过环境变量注入） ──
# ⚠️ 安全要求：禁止在此处填写明文密码。本地开发请复制 application-dev.example.yml 为
#    application-dev.yml 并设置 dev 默认值，或直接设置环境变量。
admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:}
operator:
  initial-password: ${OPERATOR_INITIAL_PASSWORD:}

# ── CORS 跨域配置 ──
# 开发环境允许所有来源（*），生产环境通过 CORS_ALLOWED_ORIGINS 环境变量覆盖
cors:
  allowed-origins: "*"

server:
  port: 8080

spring:
  # 默认使用 dev profile（本地开发），生产环境通过 -Dspring.profiles.active=prod 覆盖
  profiles:
    default: dev
  application:
    name: energy-management-platform
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:energy_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    # Jackson 3: WRITE_DATES_AS_TIMESTAMPS 已移除，日期默认以 ISO 字符串写出
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.competition.energycontrollerplatform.entity
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ── Knife4j 接口文档（仅开发环境启用） ──
springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  group-configs:
    - group: 1-管理端
      display-name: 1-管理端接口
      paths-to-match: /api/**
      paths-to-exclude: /api/v1/miniapp/**
      packages-to-scan:
        - com.competition.energycontrollerplatform.controller
    - group: 2-小程序
      display-name: 2-小程序接口
      paths-to-match: /api/v1/miniapp/**
      packages-to-scan:
        - com.competition.energycontrollerplatform.miniapp.controller

# ── 表计编号生成配置 ──
# 交付后甲方如需改变编号格式，修改以下配置项即可，无需改动 Java 代码。
# 编号规则：前缀 + 零填充序列号，总长度固定为 total-length
# 示例：前缀 "01" + 总长 12 + 序号 1 → "010000000001"
meter:
  no:
    # 电表编号前缀（meterType=1）
    electric-prefix: "ELEC"
    # 水表编号前缀（meterType=0）
    water-prefix: "WATER"
    # 编号总长度（包含前缀），不足左侧补0
    total-length: 12

# ── 自动计费配置 ──
billing:
  # 默认单价（元/kWh 或 元/吨），当 t_rate_config 无配置时使用
  default-unit-price: 0.85
  # 调度分页大小
  page-size: 100
  # cron 表达式：默认每 5 分钟（测试用），生产改为 "0 0 2 * * *"（每天凌晨 2 点）
  cron: "0 */5 * * * *"

# ── JWT 签名密钥 ──
# ⚠️ 安全要求：禁止在此处填写真实密钥。本地开发请复制 application-dev.example.yml 为
#    application-dev.yml 并设置 dev 密钥，或直接设置环境变量。
#    生成命令：openssl rand -base64 32
jwt:
  web-secret: ${JWT_WEB_SECRET:}
  miniapp-secret: ${JWT_MINIAPP_SECRET:}

# ── Actuator 监控端点 ──
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.competition.energycontrollerplatform: debug
    org.springframework.web: info

# ── 文件存储配置 ──
storage:
  # 当前激活的存储后端：local / oss / minio
  active: local
  # 服务端基础URL（用于生成本地文件的完整访问地址）
  base-url: http://localhost:8080
  # 单文件最大大小（字节），默认 50MB
  max-file-size: 52428800
  # 文件类型白名单（MIME类型；为空则使用默认白名单）
  # allowed-mime-types:
  #   - image/jpeg
  #   - image/png
  #   - application/pdf
  # 文件扩展名白名单（为空则使用默认白名单）
  # allowed-extensions:
  #   - .jpg
  #   - .png
  #   - .pdf
  local:
    # 本地文件存储根目录
    root-path: ./uploads
    # HTTP 访问 URL 前缀（对应 WebMvcConfig 中的静态资源映射）
    url-prefix: /files
  oss:
    # 阿里云 OSS 地域节点
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    # AccessKey（⚠️ 生产环境通过环境变量注入）
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:energy-platform}
    # CDN加速域名（选填；不填则使用默认OSS域名）
    base-url: ${OSS_BASE_URL:}
  minio:
    # MinIO 服务端点
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # 访问凭证（⚠️ 生产环境通过环境变量注入）
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:energy-platform}
    path-style-access: true

# ── 小程序配置 ──
miniapp:
  wechat:
    appid: ${WECHAT_APPID:wx_test_appid_placeholder}
    secret: ${WECHAT_SECRET:test_secret_placeholder}
    mock-enabled: true
  sms:
    # 开发模式：true 时跳过短信验证，固定验证码为 000000
    dev-mode: true
    dev-code: "000000"

# ── 第三方平台集成配置 ──
integration:
  jicheng:
    base-url: http://127.0.0.1:8080/ws/rsyw
    sign: ${JICHENG_SIGN:}
    connect-timeout: 10000
    read-timeout: 30000
  jiexian:
    base-url: ${JIEXIAN_BASE_URL:http://api.camrgo.com/camrgo/interface}
    company-code: ${JIEXIAN_COMPANY_CODE:0602}
    connect-timeout: 10000
    read-timeout: 30000
    v5-enabled: false
    v5-base-url: ${JIEXIAN_V5_BASE_URL:https://v5.camrgo.com/api}
    v5-username1: ${JIEXIAN_V5_USERNAME_1:}
    v5-password1: ${JIEXIAN_V5_PASSWORD_1:}
    v5-username2: ${JIEXIAN_V5_USERNAME_2:}
    v5-password2: ${JIEXIAN_V5_PASSWORD_2:}
    v5-page-size: ${JIEXIAN_V5_PAGE_SIZE:50}
    v5-lookback-days: ${JIEXIAN_V5_LOOKBACK_DAYS:2}
  haopu:
    base-url: ${HAOPU_BASE_URL:https://your-haopu-api-host.com}
    app-id: ${HAOPU_APP_ID:}
    app-secret: ${HAOPU_APP_SECRET:}
    webhook-signature: ${HAOPU_WEBHOOK_SIGNATURE:}
    connect-timeout: 10000
    read-timeout: 30000
