# =============================================================================
# 本地开发环境配置模板（spring.profiles.active=dev）
# =============================================================================
# 使用方式：
#   1. 复制此文件为 application-dev.yml（该文件已在 .gitignore 中，不会提交到 Git）
#   2. 根据本地环境修改以下配置
#   3. 启动时指定 profile：--spring.profiles.active=dev
# =============================================================================

# ── 管理员/运营人员初始密码（仅首次启动时生效） ──
admin:
  initial-password: admin123
operator:
  initial-password: operator123

# ── JWT 签名密钥（⚠️ 仅限本地开发，生产环境通过环境变量注入） ──
jwt:
  # 管理端 JWT 密钥（Base64，生成命令：openssl rand -base64 32）
  web-secret: "ZGV2LXdlYi1zZWNyZXQtZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktYWJjZGVmZ2hpamtsbW5vcDEyMzQ1Njc4OTA9PQ=="
  # 小程序端 JWT 密钥
  miniapp-secret: "ZGV2LW1pbmlhcHAtc2VjcmV0LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWFiY2RlZmdoaWprbG1ub3AxMjM0NTY3ODkwPT0="

# ── 数据库（本地开发） ──
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/energy_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  cache:
    type: none

# ── 小程序（开发模式） ──
miniapp:
  wechat:
    appid: wx_test_appid_placeholder
    secret: test_secret_placeholder
  sms:
    dev-mode: true
    dev-code: "000000"

# ── 日志 ──
logging:
  level:
    com.competition.energycontrollerplatform: debug
    org.springframework.web: info

app:
  redis:
    enabled: false
  scheduling:
    enabled: false
